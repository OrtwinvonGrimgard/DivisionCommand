<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Eigene Filz-/Kartentuchstruktur (feldgrün-oliv) -->
  <filter id="n" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="11" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.2  0 0 0 0 0.22  0 0 0 0 0.14  0 0 0 .5 0"/>
  </filter>
  <rect width="256" height="256" fill="#2e3322"/>
  <rect width="256" height="256" filter="url(#n)"/>
</svg>
