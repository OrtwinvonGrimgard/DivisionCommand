<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Division Command 0.5a Alpha</title>
  <link rel="stylesheet" href="css/app.css?v=pt1">
  <style>
    #title-root.boot-intro > .title-brand { opacity: 0 !important; }
    #title-root.boot-intro #scr-boot .menu { opacity: 0 !important; }
  </style>
</head>
<body>
  <div id="title-root" class="boot-intro">
    <div class="title-brand">
      <img class="title-logo" src="assets/title-logo.png" alt="Division Command">
    </div>
    <div class="title-panel">
      <div id="scr-boot" class="screen on splash">
        <div class="menu">
          <button type="button" class="primary" id="go-start">Spiel starten</button>
        </div>
      </div>
      <div id="scr-title" class="screen splash">
        <div class="menu">
          <button type="button" class="primary" id="go-single">Einzelspieler</button>
          <button type="button" id="go-lan">LAN / Hamachi</button>
          <button type="button" id="go-library">Bibliothek</button>
          <button type="button" id="go-hilfe">Hilfe</button>
          <button type="button" id="go-user">Benutzer</button>
          <button type="button" id="go-playtest">Playtest / Logs</button>
          <button type="button" id="go-options">Optionen</button>
          <button type="button" id="go-quit">Beenden</button>
        </div>
      </div>
    </div>
  </div>

  <div id="screen-container"></div>

  <script src="js/ui/title-fx.js?v=05ax"></script>
  <script>window.DC_FOLDER_PNG = true;</script>
  <script src="js/version.js?v=05a"></script>
  <script src="js/data/keywords.js?v=tac1"></script>
  <script src="js/data/sets/types/doktrinen.js?v=t1"></script>
  <script src="js/data/sets/types/tokens.js?v=t1"></script>
  <script src="js/data/sets/types/infanterie.js?v=kw1"></script>
  <script src="js/data/sets/types/panzer.js?v=kw1"></script>
  <script src="js/data/sets/types/artillerie.js?v=tac1"></script>
  <script src="js/data/sets/types/aufklaerung.js?v=kw1"></script>
  <script src="js/data/sets/types/elite.js?v=tac1"></script>
  <script src="js/data/sets/types/unterstuetzung.js?v=tac1"></script>
  <script src="js/data/sets/types/soforteinsatz.js?v=tac1"></script>
  <script src="js/data/sets/types/ausruestung.js?v=tac1"></script>
  <script src="js/data/nationen.js?v=05a"></script>
  <script src="js/data/decks.js?v=05a"></script>
  <script src="js/data/cards.js?v=05a"></script>
  <script src="js/engine.js?v=05a"></script>
  <script src="js/bot.js?v=05a"></script>
  <script src="js/ui.js?v=05a"></script>
  <script src="js/lan.js?v=05a"></script>
  <script src="js/library.js?v=05a"></script>
  <script src="js/user.js?v=05a"></script>
  <script src="js/options.js?v=05a"></script>
  <script src="js/playtest.js?v=05a"></script>
  <script src="js/ui/title-menu.js?v=1"></script>
  <script>
    // Load partial screens on demand
    async function loadPartial(name) {
      if (document.getElementById('scr-' + name)) return;
      try {
        const res = await fetch('partials/' + name + '.html');
        if (!res.ok) return;
        const html = await res.text();
        document.getElementById('screen-container').insertAdjacentHTML('beforeend', html);
      } catch (e) { console.warn('Partial load failed', name, e); }
    }
    document.getElementById('go-hilfe').addEventListener('click', function() { loadPartial('hilfe'); }, true);
    document.getElementById('go-library').addEventListener('click', function() { loadPartial('library'); }, true);
  </script>
</body>
</html>
