<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Division Command 0.5a Alpha</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#12140f">
  <link rel="stylesheet" href="css/app.css?v=pt1">
  <link rel="stylesheet" href="css/end-screen.css?v=1">
  <link rel="stylesheet" href="css/kit-editor.css?v=1">
  <link rel="stylesheet" href="css/align.css?v=handzoom2" id="dc-align-css">
  <link rel="stylesheet" href="css/table-cards.css?v=fit1">
  <link rel="stylesheet" href="css/table-effects.css?v=fit1">
  <link rel="stylesheet" href="css/table-camera.css?v=ot1">
  <link rel="stylesheet" href="css/officer-table.css?v=sc4">
  <link rel="stylesheet" href="css/inspect-large.css?v=1">
  <link rel="stylesheet" href="css/table-chat.css?v=1">
  <link rel="stylesheet" href="css/hud-pro.css?v=1">
  <link rel="stylesheet" href="css/card-placeholder.css?v=kw1">
  <style>
    .title-brand .ver-big { display: none !important; }
    #dc-version {
      position: fixed !important;
      left: 16px !important;
      bottom: 12px !important;
      z-index: 200 !important;
    }
    body:has(#title-root.boot-intro:not(.btn-in)) #dc-version { opacity: 0 !important; }
    #title-root.boot-intro > .title-brand { opacity: 0 !important; }
    #title-root.boot-intro #scr-boot .menu { opacity: 0 !important; }
  </style>
</head>
<body>
  <div id="match-host"></div>
  <audio id="bgm" autoplay preload="auto" src="assets/audio/menue/Division%20Command%20(Remastered).wav"></audio>
  <div id="dc-version">Alpha 0.5a</div>
  <div id="title-root" class="boot-intro">
    <div class="title-brand">
      <img class="title-logo" src="assets/title-logo.png?v=6" alt="Division Command">
    </div>
    <div class="title-panel">
      <div id="scr-boot" class="screen on splash">
        <div class="menu">
          <button type="button" class="primary" id="go-start">Spiel starten</button>
        </div>
      </div>
      <div id="scr-title" class="screen splash">
        <div class="menu">
          <button type="button" class="primary" id="go-single">Einzelspieler</button>
          <button type="button" id="go-lan">LAN / Hamachi</button>
          <button type="button" id="go-library">Bibliothek</button>
          <button type="button" id="go-hilfe">Hilfe</button>
          <button type="button" id="go-user">Benutzer</button>
          <button type="button" id="go-playtest">Playtest / Logs</button>
          <button type="button" id="go-options">Optionen</button>
          <button type="button" id="go-quit">Beenden</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Full content continues in original; this is the working structure with all screens -->
  <div id="scr-options" class="screen">
    <h1>Optionen</h1>
    <label>Musik <input id="opt-music" type="checkbox" checked></label>
    <label>Lautstärke <input id="opt-vol" type="range" min="0" max="100" value="55"></label>
    <button class="back" id="back-options">Zurück</button>
  </div>
  <div id="scr-library" class="screen">
    <h1>Bibliothek</h1>
    <div class="lib-tabs" id="lib-tabs"></div>
    <button class="back" id="back-library">Zurück</button>
  </div>
  <div id="scr-user" class="screen">
    <h1>Benutzer</h1>
    <div id="user-faces" class="kit-grid"></div>
    <button class="back" id="back-user">Zurück</button>
  </div>
  <div id="scr-hilfe" class="screen">
    <h1>HILFE</h1>
    <p>Detaillierte Hilfe.</p>
    <button class="back" id="back-hilfe">Zurück</button>
  </div>
  <script src="js/ui/title-fx.js?v=05ax"></script>
  <script src="js/ui/title-menu.js?v=1"></script>
  <script>
    function show(id) {
      document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('on'); });
      var el = document.getElementById(id);
      if (el) el.classList.add('on');
      var title = document.getElementById('title-root');
      if (title) title.style.display = (id === 'scr-title' || id === 'scr-boot') ? '' : 'none';
    }
    document.getElementById('go-start').onclick = function(){ show('scr-title'); };
    document.getElementById('go-options').onclick = function(){ show('scr-options'); };
    document.getElementById('go-library').onclick = function(){ show('scr-library'); };
    document.getElementById('go-user').onclick = function(){ show('scr-user'); };
    document.getElementById('go-hilfe').onclick = function(){ show('scr-hilfe'); };
    document.getElementById('back-options').onclick = function(){ show('scr-title'); };
    document.getElementById('back-library').onclick = function(){ show('scr-title'); };
    document.getElementById('back-user').onclick = function(){ show('scr-title'); };
    document.getElementById('back-hilfe').onclick = function(){ show('scr-title'); };
    (function bootIntro() {
      var tr = document.getElementById('title-root');
      if (!tr) return;
      setTimeout(function () { tr.classList.add('logo-in'); }, 1400);
      setTimeout(function () { tr.classList.add('btn-in'); }, 5000);
    })();
  </script>
</body>
</html>
