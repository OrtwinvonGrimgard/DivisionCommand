<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Division Command 0.5a Alpha</title>
  <link rel="stylesheet" href="css/app.css?v=pt1">
  <style>
    #title-root { display: block; }
    #title-root.hidden { display: none !important; }
    .screen { display: none; }
    .screen.on { display: block; }
  </style>
</head>
<body>
  <audio id="bgm" autoplay preload="auto" src="assets/audio/menue/Division%20Command%20(Remastered).wav"></audio>

  <div id="title-root">
    <div class="title-brand">
      <img class="title-logo" src="assets/title-logo.png" alt="Division Command">
    </div>
    <div id="scr-boot" class="screen on">
      <div class="menu">
        <button type="button" class="primary" id="go-start">Spiel starten</button>
      </div>
    </div>
    <div id="scr-title" class="screen">
      <div class="menu">
        <button type="button" class="primary" id="go-single">Einzelspieler</button>
        <button type="button" id="go-hilfe">Hilfe</button>
        <button type="button" id="go-library">Bibliothek</button>
        <button type="button" id="go-user">Benutzer</button>
        <button type="button" id="go-options">Optionen</button>
      </div>
    </div>
  </div>

  <div id="scr-single" class="screen"><h1>Einzelspieler</h1><p>Gegen den Bot.</p><button id="back-single">Zurück</button></div>
  <div id="scr-hilfe" class="screen"><h1>HILFE</h1><p>Detaillierte Hilfe wird geladen...</p><button id="back-hilfe">Zurück</button></div>
  <div id="scr-library" class="screen"><h1>Bibliothek</h1><p>Deckbuilder.</p><button id="back-library">Zurück</button></div>
  <div id="scr-user" class="screen"><h1>Benutzer</h1><p>Offiziersakte.</p><button id="back-user">Zurück</button></div>
  <div id="scr-options" class="screen"><h1>Optionen</h1><p>Musik, Sound, Bot.</p><button id="back-options">Zurück</button></div>

  <script>
    function show(id) {
      document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('on'); });
      var el = document.getElementById(id);
      if (el) el.classList.add('on');
      var title = document.getElementById('title-root');
      if (title) {
        if (id === 'scr-title' || id === 'scr-boot') title.classList.remove('hidden');
        else title.classList.add('hidden');
      }
    }
    document.getElementById('go-start').onclick = function(){ show('scr-title'); };
    document.getElementById('go-single').onclick = function(){ show('scr-single'); };
    document.getElementById('go-hilfe').onclick = function(){ show('scr-hilfe'); };
    document.getElementById('go-library').onclick = function(){ show('scr-library'); };
    document.getElementById('go-user').onclick = function(){ show('scr-user'); };
    document.getElementById('go-options').onclick = function(){ show('scr-options'); };
    ['single','hilfe','library','user','options'].forEach(function(n){
      var b = document.getElementById('back-'+n);
      if (b) b.onclick = function(){ show('scr-title'); };
    });
  </script>
</body>
</html>
