<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Division Command 0.5a Alpha</title>
  <link rel="stylesheet" href="css/app.css?v=pt1">
  <style>
    #title-root.boot-intro > .title-brand { opacity: 0 !important; }
    #title-root.boot-intro #scr-boot .menu { opacity: 0 !important; }
  </style>
</head>
<body>
  <div id="title-root" class="boot-intro">
    <div class="title-brand">
      <img class="title-logo" src="assets/title-logo.png" alt="Division Command">
    </div>
    <div class="title-panel">
      <div id="scr-boot" class="screen on splash">
        <div class="menu">
          <button type="button" class="primary" id="go-start">Spiel starten</button>
        </div>
      </div>
      <div id="scr-title" class="screen splash">
        <div class="menu">
          <button type="button" class="primary" id="go-single">Einzelspieler</button>
          <button type="button" id="go-lan">LAN / Hamachi</button>
          <button type="button" id="go-library">Bibliothek</button>
          <button type="button" id="go-hilfe">Hilfe</button>
          <button type="button" id="go-user">Benutzer</button>
          <button type="button" id="go-playtest">Playtest / Logs</button>
          <button type="button" id="go-options">Optionen</button>
          <button type="button" id="go-quit">Beenden</button>
        </div>
      </div>
    </div>
  </div>

  <div id="scr-single" class="screen"><h1>Einzelspieler</h1><p>Wird geladen...</p><button class="back" id="back-single">Zurück</button></div>
  <div id="scr-lan" class="screen"><h1>LAN / Hamachi</h1><p>Wird geladen...</p><button class="back" id="back-lan">Zurück</button></div>
  <div id="scr-library" class="screen"><h1>Bibliothek</h1><p>Wird geladen...</p><button class="back" id="back-library">Zurück</button></div>
  <div id="scr-user" class="screen"><h1>Benutzer</h1><p>Wird geladen...</p><button class="back" id="back-user">Zurück</button></div>
  <div id="scr-playtest" class="screen"><h1>Playtest</h1><p>Wird geladen...</p><button class="back" id="back-playtest">Zurück</button></div>
  <div id="scr-options" class="screen"><h1>Optionen</h1><p>Wird geladen...</p><button class="back" id="back-options">Zurück</button></div>
  <div id="scr-hilfe" class="screen">
    <h1 class="page-title">HILFE</h1>
    <div class="hilfe-body"><p>Hilfe wird geladen...</p></div>
    <div class="menu"><button type="button" class="back" id="back-hilfe">Zurück</button></div>
  </div>

  <script src="js/ui/title-fx.js?v=05ax"></script>
  <script>window.DC_FOLDER_PNG = true;</script>
  <script src="js/version.js?v=05a"></script>
  <script src="js/data/keywords.js?v=tac1"></script>
  <script src="js/data/sets/types/doktrinen.js?v=t1"></script>
  <script src="js/data/sets/types/tokens.js?v=t1"></script>
  <script src="js/data/sets/types/infanterie.js?v=kw1"></script>
  <script src="js/data/sets/types/panzer.js?v=kw1"></script>
  <script src="js/data/sets/types/artillerie.js?v=tac1"></script>
  <script src="js/data/sets/types/aufklaerung.js?v=kw1"></script>
  <script src="js/data/sets/types/elite.js?v=tac1"></script>
  <script src="js/data/sets/types/unterstuetzung.js?v=tac1"></script>
  <script src="js/data/sets/types/soforteinsatz.js?v=tac1"></script>
  <script src="js/data/sets/types/ausruestung.js?v=tac1"></script>
  <script src="js/data/nationen.js?v=05a"></script>
  <script src="js/data/decks.js?v=05a"></script>
  <script src="js/data/cards.js?v=05a"></script>
  <script src="js/engine.js?v=05a"></script>
  <script src="js/bot.js?v=05a"></script>
  <script src="js/ui.js?v=05a"></script>
  <script src="js/lan.js?v=05a"></script>
  <script src="js/library.js?v=05a"></script>
  <script src="js/user.js?v=05a"></script>
  <script src="js/options.js?v=05a"></script>
  <script src="js/playtest.js?v=05a"></script>
  <script>
    function show(id) {
      document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('on'); });
      var el = document.getElementById(id);
      if (el) el.classList.add('on');
    }
    document.getElementById('go-start').onclick = function () {
      var tr = document.getElementById('title-root');
      if (tr) tr.classList.remove('boot-intro', 'logo-in', 'btn-in');
      show('scr-title');
    };
    document.getElementById('go-single').onclick = function () { show('scr-single'); };
    document.getElementById('go-lan').onclick = function () { show('scr-lan'); };
    document.getElementById('go-library').onclick = function () { show('scr-library'); };
    document.getElementById('go-hilfe').onclick = function () { show('scr-hilfe'); };
    document.getElementById('go-user').onclick = function () { show('scr-user'); };
    document.getElementById('go-playtest').onclick = function () { show('scr-playtest'); };
    document.getElementById('go-options').onclick = function () { show('scr-options'); };
    document.getElementById('go-quit').onclick = function () { if (confirm('Beenden?')) window.close(); };
    document.getElementById('back-single').onclick = function () { show('scr-title'); };
    document.getElementById('back-lan').onclick = function () { show('scr-title'); };
    document.getElementById('back-library').onclick = function () { show('scr-title'); };
    document.getElementById('back-user').onclick = function () { show('scr-title'); };
    document.getElementById('back-playtest').onclick = function () { show('scr-title'); };
    document.getElementById('back-options').onclick = function () { show('scr-title'); };
    document.getElementById('back-hilfe').onclick = function () { show('scr-title'); };
    (function bootIntro() {
      var tr = document.getElementById('title-root');
      if (!tr) return;
      setTimeout(function () { tr.classList.add('logo-in'); }, 1400);
      setTimeout(function () { tr.classList.add('btn-in'); }, 5000);
    })();
  </script>
</body>
</html>
